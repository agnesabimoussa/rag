[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "abimoussagnes", email = "agnesabimoussa17@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "accelerate>=1.14.0",
    "bm25>=0.3.10",
    "chonkie>=1.7.0",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "fire>=0.7.1",
    "huggingface-hub>=1.27.0",
    "langchain-text-splitters>=1.1.2",
    "rank-bm25>=0.2.2",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.15.0",
    "tree-sitter-language-pack>=1.14.3",
    "uvicorn>=0.52.3",
]

[project.scripts]
rag = "rag:main"

[tool.mypy]
exclude = [
    "^data/",
    "^models/",
    "^inputs/",
    "^\\.venv/",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
